<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Quản trị – Trạm AI Việt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1020;--bg2:#111833;--card:#151d3b;--line:#26305a;--text:#eef1ff;--muted:#9aa4cf;
  --brand:#6d5dfc;--brand2:#22d3ee;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
a{color:inherit}
button{font-family:inherit;cursor:pointer;border:0}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:rgba(11,16,32,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:58px;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.logo img{width:32px;height:32px;border-radius:50%}
.logo i{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;font-style:normal;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;background:var(--bg2);color:var(--text);border:1px solid var(--line);white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:linear-gradient(135deg,var(--brand),#8b5cf6);border:0;color:#fff}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.bad{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.4);color:#fca5a5}
.btn:disabled{opacity:.6;cursor:wait}
main{padding:20px 0 60px}
.tabs2{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto}
.tab2{padding:9px 16px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap}
.tab2.on{background:var(--brand);border-color:var(--brand);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.filters{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px}
.fchip{padding:7px 14px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.fchip.on{background:var(--card);border-color:var(--brand);color:var(--text)}
.fchip.big{padding:13px 18px;font-size:15px;flex:1;text-align:center}
#oSearch{margin-bottom:12px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}
input,textarea,select{width:100%;padding:11px 13px;border-radius:12px;background:var(--bg);border:1px solid var(--line);color:var(--text);font-family:inherit;font-size:15px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand)}
.err{color:#fca5a5;font-size:14px;margin-top:10px;min-height:20px}
.oitem{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.oitem .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.oitem code{background:var(--card);padding:2px 8px;border-radius:6px;font-size:13px}
.oitem .meta{color:var(--muted);font-size:13px;margin-top:6px}
.st-badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.st-pending{background:rgba(154,164,207,.15);color:var(--muted)}
.st-paid{background:rgba(245,158,11,.15);color:#fcd34d}
.st-done{background:rgba(34,197,94,.15);color:#86efac}
.st-short{background:rgba(239,68,68,.15);color:#fca5a5}
.oitem .detail{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:none}
.oitem.open .detail{display:block}
.row2{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.row2 .btn{flex:1}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:99;display:none}
.staffitem{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.staffitem .info b{display:block}
.staffitem .info small{color:var(--muted)}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(109,93,252,.15);color:#c4bdff}
.balbox{display:flex;justify-content:space-between;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.balbox b{font-size:22px}
.login-wrap{max-width:380px;margin:60px auto;padding:0 16px}
h1{font-size:20px;margin-bottom:4px}
.sub{color:var(--muted);font-size:14px;margin-bottom:16px}
</style>
<link rel="icon" href="logo.svg" type="image/svg+xml">
</head>
<body>

<header>
  <div class="wrap nav">
    <div class="logo"><img src="logo.svg" alt="Trạm AI Việt">Quản trị Trạm AI Việt</div>
    <div id="navRight"></div>
  </div>
</header>

<main class="wrap">
  <div id="loginView" class="login-wrap">
    <h1>Đăng nhập quản trị</h1>
    <p class="sub">Dùng tài khoản đã được cấp quyền admin/nhân viên.</p>
    <form id="fLogin">
      <label>Số điện thoại / Zalo</label><input name="contact" required inputmode="tel" placeholder="09xx xxx xxx">
      <label>Mật khẩu</label><input name="password" type="password" required minlength="6" placeholder="Mật khẩu">
      <div class="err" id="lErr"></div>
      <button class="btn pri" style="width:100%;margin-top:6px" type="submit">Đăng nhập</button>
    </form>
  </div>

  <div id="dashView" style="display:none">
    <div class="tabs2" id="tabs2"></div>
    <div id="ordersTab"></div>
    <div id="walletTab" style="display:none"></div>
    <div id="staffTab" style="display:none"></div>
    <div id="productsTab" style="display:none"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzV_KlAwzimsh1zEaaTZvO9zcxq5ZmQmTbye17b9NYYNJ1DqeHCT9o20xUXlES1dLNlUw/exec';
const LS_ADMIN = 'tav_admin_session';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => Number(n).toLocaleString('vi-VN') + ' đ';

let SESSION = null, TAB = 'orders', ORDER_GROUP = 'pending', ORDER_SEARCH = '', ALL_ORDERS = [];

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 2200); }

async function fetchJson(url, opt = {}, ms = 20000) {
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), ms);
  try {
    const r = await fetch(url, { ...opt, signal: ac.signal });
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    return j;
  } catch (e) { if (e.message && e.message !== 'Failed to fetch') throw e; throw new Error('Mạng chậm, vui lòng thử lại'); }
  finally { clearTimeout(t); }
}
async function apiPost(body) {
  try {
    return await fetchJson(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, session: body.session || (SESSION && SESSION.token) }) }, 30000);
  } catch (err) {
    if (/đăng nhập lại|quyền truy cập/.test(err.message)) { clearSavedSession(); location.reload(); }
    throw err;
  }
}

function getSavedSession() { try { const v = localStorage.getItem(LS_ADMIN); return v ? JSON.parse(v) : null; } catch { return null; } }
function saveSession(v) { SESSION = v; try { localStorage.setItem(LS_ADMIN, JSON.stringify(v)); } catch {} }
function clearSavedSession() { SESSION = null; try { localStorage.removeItem(LS_ADMIN); } catch {} }

$('#fLogin').onsubmit = async e => {
  e.preventDefault();
  const btn = e.target.querySelector('button'); btn.disabled = true; $('#lErr').textContent = '';
  const f = new FormData(e.target);
  try {
    const r = await fetchJson(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'login', contact: f.get('contact'), password: f.get('password'), remember: true }) }, 20000);
    if (r.customer.role !== 'admin' && r.customer.role !== 'staff') { $('#lErr').textContent = 'Tài khoản này không có quyền quản trị.'; btn.disabled = false; return; }
    saveSession({ token: r.session, customer: r.customer });
    enterDash();
  } catch (err) { $('#lErr').textContent = err.message; btn.disabled = false; }
};

function renderNav() {
  const c = SESSION.customer;
  $('#navRight').innerHTML = `<span style="color:var(--muted);font-size:13px;margin-right:10px">${esc(c.name)} · <span class="pill">${c.role === 'admin' ? 'Admin' : 'Nhân viên'}</span></span><button class="btn sm" id="btnLogout">Đăng xuất</button>`;
  $('#btnLogout').onclick = () => { clearSavedSession(); location.reload(); };
}

function renderTabs() {
  const isAdmin = SESSION.customer.role === 'admin';
  const tabs = [['orders', 'Đơn hàng'], ...(isAdmin ? [['products', 'Sản phẩm'], ['wallet', 'Khách hàng'], ['staff', 'Nhân viên']] : [])];
  $('#tabs2').innerHTML = tabs.map(([k, label]) => `<button class="tab2 ${TAB === k ? 'on' : ''}" data-tab="${k}">${label}</button>`).join('');
  $('#tabs2').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { TAB = b.dataset.tab; renderTabs(); showTab(); });
}

function showTab() {
  $('#ordersTab').style.display = TAB === 'orders' ? 'block' : 'none';
  $('#walletTab').style.display = TAB === 'wallet' ? 'block' : 'none';
  $('#staffTab').style.display = TAB === 'staff' ? 'block' : 'none';
  $('#productsTab').style.display = TAB === 'products' ? 'block' : 'none';
  if (TAB === 'orders') loadOrders();
  if (TAB === 'wallet') renderWalletTab();
  if (TAB === 'staff') loadStaff();
  if (TAB === 'products') loadProducts();
}

// ===== Đơn hàng =====
function stBadgeClass(s) {
  if (s === 'Đã giao') return 'st-done';
  if (s === 'Đã thanh toán - chờ giao') return 'st-paid';
  if (s === 'Chuyển thiếu') return 'st-short';
  return 'st-pending';
}
async function loadOrders() {
  $('#ordersTab').innerHTML = `<div class="card"><div class="empty">Đang tải…</div></div>`;
  try {
    const r = await apiPost({ action: 'adminOrders', status: '' });
    ALL_ORDERS = r.orders;
    renderOrdersShell();
  } catch (err) { $('#ordersTab').innerHTML = `<div class="card"><div class="empty">${esc(err.message)}</div></div>`; }
}
function renderOrdersShell() {
  const pendingCount = ALL_ORDERS.filter(o => o.status !== 'Đã giao').length;
  const doneCount = ALL_ORDERS.filter(o => o.status === 'Đã giao').length;
  $('#ordersTab').innerHTML = `
    <div class="filters" id="ogroups">
      <button class="fchip big ${ORDER_GROUP === 'pending' ? 'on' : ''}" data-g="pending">🔴 Chưa xử lý (${pendingCount})</button>
      <button class="fchip big ${ORDER_GROUP === 'done' ? 'on' : ''}" data-g="done">✅ Đã xử lý (${doneCount})</button>
    </div>
    <input id="oSearch" placeholder="🔍 Tìm theo mã đơn, vd: TAVK5TTYV" value="${esc(ORDER_SEARCH)}">
    <div id="olist"></div>`;
  $('#ogroups').querySelectorAll('[data-g]').forEach(b => b.onclick = () => { ORDER_GROUP = b.dataset.g; renderOrdersShell(); });
  $('#oSearch').oninput = e => { ORDER_SEARCH = e.target.value; renderOrderList(); };
  renderOrderList();
}
function renderOrderList() {
  let list = ALL_ORDERS.filter(o => ORDER_GROUP === 'done' ? o.status === 'Đã giao' : o.status !== 'Đã giao');
  const q = ORDER_SEARCH.trim().toUpperCase();
  if (q) list = list.filter(o => (o.code || '').toUpperCase().includes(q));
  renderOrders(list);
}
function renderOrders(orders) {
  if (!orders.length) { $('#olist').innerHTML = '<div class="card"><div class="empty">Không có đơn nào.</div></div>'; return; }
  $('#olist').innerHTML = orders.map(o => `
    <div class="oitem" data-code="${esc(o.code)}">
      <div class="top">
        <div><code>${esc(o.code)}</code> <span class="st-badge ${stBadgeClass(o.status)}">${esc(o.status)}</span></div>
        <b>${money(o.amount)}</b>
      </div>
      <div class="meta">${esc(o.product)} · ${esc(o.time)}</div>
      <div class="meta">Khách: ${esc(o.name)} · ${esc(o.contact)} · ${esc(o.email)}${o.extra ? '<br>Khách gửi: ' + esc(o.extra) : ''}</div>
      <div class="detail">
        <label>Nội dung giao cho khách (acc | mk | hướng dẫn)</label>
        <textarea rows="3" data-content>${esc(o.content)}</textarea>
        <div class="row2">
          <button class="btn sm" data-save>Lưu nội dung</button>
          ${o.status !== 'Đã giao' ? '<button class="btn pri sm" data-done>✅ Đánh dấu đã giao</button>' : ''}
        </div>
      </div>
    </div>`).join('');
  $('#ordersTab').querySelectorAll('.oitem .top').forEach(el => el.onclick = () => el.closest('.oitem').classList.toggle('open'));
  $('#ordersTab').querySelectorAll('[data-save]').forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const item = b.closest('.oitem'); const content = item.querySelector('[data-content]').value;
    b.disabled = true;
    try { await apiPost({ action: 'adminUpdateOrder', code: item.dataset.code, content }); toast('Đã lưu'); }
    catch (err) { toast(err.message); }
    b.disabled = false;
  });
  $('#ordersTab').querySelectorAll('[data-done]').forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const item = b.closest('.oitem'); const content = item.querySelector('[data-content]').value;
    if (!confirm('Xác nhận đã giao đơn ' + item.dataset.code + '? Khách sẽ nhận email thông báo.')) return;
    b.disabled = true;
    try { await apiPost({ action: 'adminUpdateOrder', code: item.dataset.code, content, markDone: true }); toast('Đã đánh dấu giao xong'); loadOrders(); }
    catch (err) { toast(err.message); b.disabled = false; }
  });
}

// ===== Khách hàng (admin) =====
let ALL_CUSTOMERS = [], CUST_SEARCH = '';
async function renderWalletTab() {
  $('#walletTab').innerHTML = `<div class="card"><div class="empty">Đang tải…</div></div>`;
  try {
    const r = await apiPost({ action: 'adminListCustomers' });
    ALL_CUSTOMERS = r.customers;
    renderCustomerList();
  } catch (err) { $('#walletTab').innerHTML = `<div class="card"><div class="empty">${esc(err.message)}</div></div>`; }
}
function renderCustomerList() {
  $('#walletTab').innerHTML = `
    <button class="btn block" id="cExport" style="margin-bottom:10px">📤 Tải danh sách khách lên Google Sheet</button>
    <div class="row2" style="margin-bottom:10px">
      <button class="btn" id="cReconcile" style="flex:1">🧮 Đối soát ví</button>
      <button class="btn" id="cBackup" style="flex:1">💾 Sao lưu ngay</button>
    </div>
    <div id="cReport"></div>
    <input id="cSearch" placeholder="🔍 Tìm theo tên hoặc số điện thoại" value="${esc(CUST_SEARCH)}">
    <div id="clist"></div>`;
  $('#cSearch').oninput = e => { CUST_SEARCH = e.target.value; renderCustomerItems(); };
  $('#cExport').onclick = async () => {
    const btn = $('#cExport'); btn.disabled = true; btn.textContent = 'Đang tạo…';
    try {
      const r = await apiPost({ action: 'adminExportCustomers' });
      toast('Đã cập nhật Google Sheet');
      window.open(r.url, '_blank');
    } catch (err) { toast(err.message); }
    btn.disabled = false; btn.textContent = '📤 Tải danh sách khách lên Google Sheet';
  };
  $('#cBackup').onclick = async () => {
    const btn = $('#cBackup'); btn.disabled = true; btn.textContent = 'Đang sao lưu…';
    try { const r = await apiPost({ action: 'adminBackupNow' }); toast('Đã sao lưu'); window.open(r.url, '_blank'); }
    catch (err) { toast(err.message); }
    btn.disabled = false; btn.textContent = '💾 Sao lưu ngay';
  };
  $('#cReconcile').onclick = () => runReconcile(false);
  renderCustomerItems();
}
async function runReconcile(baseline) {
  const btn = $('#cReconcile'); btn.disabled = true;
  try {
    const r = await apiPost({ action: 'adminReconcile', baseline });
    let h = `<div class="card"><b>Kết quả đối soát:</b> ${r.ok} khách khớp sổ cái`;
    if (r.mismatches.length) h += `<div style="margin-top:8px;color:#fca5a5"><b>⚠️ ${r.mismatches.length} khách LỆCH:</b>` + r.mismatches.map(m => `<div>${esc(m.name)} · ${esc(m.phone)} — ví ${money(m.balance)}, sổ cái ${money(m.ledger)} (lệch ${money(m.diff)})</div>`).join('') + '</div>';
    if (r.untracked.length) h += `<div style="margin-top:8px"><b>${r.untracked.length} khách có tiền nhưng chưa có sổ cái:</b>` + r.untracked.map(m => `<div>${esc(m.name)} · ${esc(m.phone)} — ${money(m.balance)}</div>`).join('') + '<button class="btn pri sm" id="cBaseline" style="margin-top:8px">Ghi nhận số dư hiện tại làm mốc</button></div>';
    if (!r.mismatches.length && !r.untracked.length) h += ' ✅ Không có gì lệch.';
    $('#cReport').innerHTML = h + '</div>';
    const bb = $('#cBaseline'); if (bb) bb.onclick = () => runReconcile(true);
  } catch (err) { toast(err.message); }
  btn.disabled = false;
}
function renderCustomerItems() {
  const q = CUST_SEARCH.trim().toLowerCase();
  const qDigits = q.replace(/\D/g, '');
  let list = ALL_CUSTOMERS;
  if (q) list = list.filter(c => c.name.toLowerCase().includes(q) || (qDigits && c.phone.includes(qDigits)));
  const el = $('#clist');
  if (!list.length) { el.innerHTML = '<div class="card"><div class="empty">Không tìm thấy khách nào.</div></div>'; return; }
  el.innerHTML = list.map(c => `
    <div class="oitem" data-phone="${esc(c.phone)}">
      <div class="top">
        <div><b>${esc(c.name)}</b> ${c.isBanned ? '<span class="st-badge st-short">Đã khoá</span>' : ''}</div>
        <b>${money(c.balance)}</b>
      </div>
      <div class="meta">📱 ${esc(c.phone)} · ✉️ ${esc(c.email)} · ${c.orders} đơn</div>
      <div class="detail">
        <label>Số tiền (âm để trừ, dương để cộng)</label>
        <input inputmode="numeric" placeholder="Ví dụ 50000 hoặc -20000" data-delta>
        <label>Lý do (không bắt buộc, để lưu vết)</label>
        <input placeholder="Ví dụ: bù lỗi hệ thống" data-reason>
        <button class="btn pri sm" data-apply style="margin-top:8px;width:100%">Áp dụng vào ví</button>
        <button class="btn sm block" data-ledger style="margin-top:10px">📒 Xem lịch sử ví</button>
        <div data-ledgerbox></div>
        <div class="row2" style="margin-top:10px">
          <button class="btn sm" data-resetpw style="flex:1">🔑 Đặt lại mật khẩu</button>
          <button class="btn ${c.isBanned ? '' : 'bad'} sm" data-ban style="flex:1">${c.isBanned ? '✅ Mở khoá' : '🚫 Khoá tài khoản'}</button>
        </div>
      </div>
    </div>`).join('');
  el.querySelectorAll('.oitem .top').forEach(t => t.onclick = () => t.closest('.oitem').classList.toggle('open'));
  el.querySelectorAll('[data-apply]').forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const item = b.closest('.oitem'); const phone = item.dataset.phone;
    const delta = Math.round(Number(item.querySelector('[data-delta]').value));
    if (!delta) return toast('Nhập số tiền hợp lệ');
    if (!confirm((delta > 0 ? 'Cộng ' : 'Trừ ') + money(Math.abs(delta)) + ' vào ví ' + phone + '?')) return;
    b.disabled = true;
    try {
      const r = await apiPost({ action: 'adminAdjustBalance', phone, delta, reason: item.querySelector('[data-reason]').value });
      toast('Số dư mới: ' + money(r.balance)); renderWalletTab();
    } catch (err) { toast(err.message); b.disabled = false; }
  });
  el.querySelectorAll('[data-ledger]').forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const item = b.closest('.oitem'); const box = item.querySelector('[data-ledgerbox]');
    b.disabled = true; box.innerHTML = '<div class="meta">Đang tải…</div>';
    try {
      const r = await apiPost({ action: 'adminCustomerLedger', phone: item.dataset.phone });
      box.innerHTML = r.entries.length ? r.entries.map(x => `<div class="meta" style="border-top:1px solid var(--line);padding:6px 0">${esc(x.time)} · <b>${esc(x.kind)}</b> ${x.delta > 0 ? '+' : ''}${money(x.delta)} → số dư ${money(x.after)}${x.ref ? '<br>' + esc(x.ref) : ''}</div>`).join('') : '<div class="meta">Chưa có ghi nhận nào.</div>';
    } catch (err) { box.innerHTML = `<div class="meta">${esc(err.message)}</div>`; }
    b.disabled = false;
  });
  el.querySelectorAll('[data-resetpw]').forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const phone = b.closest('.oitem').dataset.phone;
    if (!confirm('Xoá mật khẩu của ' + phone + '? Khách cần vào web bấm "Tạo tài khoản" với đúng số này để đặt mật khẩu mới. Số dư ví và lịch sử đơn vẫn giữ nguyên.')) return;
    b.disabled = true;
    try { await apiPost({ action: 'adminResetPassword', phone }); toast('Đã xoá mật khẩu, báo khách đăng ký lại'); }
    catch (err) { toast(err.message); }
    b.disabled = false;
  });
  el.querySelectorAll('[data-ban]').forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const item = b.closest('.oitem'); const phone = item.dataset.phone;
    const toBan = b.textContent.includes('Khoá tài khoản');
    if (!confirm((toBan ? 'Khoá' : 'Mở khoá') + ' tài khoản ' + phone + '?')) return;
    b.disabled = true;
    try { await apiPost({ action: toBan ? 'adminBanCustomer' : 'adminUnbanCustomer', phone }); toast('Đã cập nhật'); renderWalletTab(); }
    catch (err) { toast(err.message); b.disabled = false; }
  });
}

// ===== Nhân viên (admin) =====
async function loadStaff() {
  $('#staffTab').innerHTML = `
    <div class="card">
      <label>Thêm / cấp quyền theo số điện thoại</label>
      <input id="sPhone" inputmode="tel" placeholder="09xx xxx xxx (người đó cần đã có tài khoản trên web)">
      <label>Vai trò</label>
      <select id="sRole"><option value="staff">Nhân viên (chỉ xử lý đơn hàng)</option><option value="admin">Admin (toàn quyền)</option></select>
      <button class="btn pri" style="width:100%;margin-top:10px" id="sAdd">Cấp quyền</button>
      <div class="err" id="sErr"></div>
    </div>
    <div id="slist" class="card"><div class="empty">Đang tải…</div></div>`;
  $('#sAdd').onclick = async () => {
    const phone = $('#sPhone').value.trim(), role = $('#sRole').value; $('#sErr').textContent = '';
    if (!phone) return;
    try { await apiPost({ action: 'adminSetStaff', phone, role }); toast('Đã cấp quyền'); $('#sPhone').value = ''; loadStaff(); }
    catch (err) { $('#sErr').textContent = err.message; }
  };
  try {
    const r = await apiPost({ action: 'adminListStaff' });
    renderStaff(r.staff);
  } catch (err) { $('#slist').innerHTML = `<div class="empty">${esc(err.message)}</div>`; }
}
function renderStaff(staff) {
  if (!staff.length) { $('#slist').innerHTML = '<div class="empty">Chưa có nhân viên nào ngoài bạn.</div>'; return; }
  $('#slist').innerHTML = staff.map(s => `
    <div class="staffitem">
      <div class="info"><b>${esc(s.name)} · ${esc(s.phone)}</b><small>${esc(s.email)} · <span class="pill">${s.role === 'admin' ? 'Admin' : 'Nhân viên'}</span></small></div>
      <button class="btn bad sm" data-remove="${esc(s.phone)}">Gỡ quyền</button>
    </div>`).join('');
  $('#slist').querySelectorAll('[data-remove]').forEach(b => b.onclick = async () => {
    if (!confirm('Gỡ quyền quản trị của ' + b.dataset.remove + '?')) return;
    try { await apiPost({ action: 'adminSetStaff', phone: b.dataset.remove, role: '' }); toast('Đã gỡ quyền'); loadStaff(); }
    catch (err) { toast(err.message); }
  });
}

// ===== Sản phẩm (admin) =====
let PRODUCTS = [];
async function loadProducts() {
  $('#productsTab').innerHTML = `<div class="card"><div class="empty">Đang tải…</div></div>`;
  try {
    const r = await apiPost({ action: 'adminListProducts' });
    PRODUCTS = r.products;
    renderProducts();
  } catch (err) { $('#productsTab').innerHTML = `<div class="card"><div class="empty">${esc(err.message)}</div></div>`; }
}
function renderProducts() {
  $('#productsTab').innerHTML = `
    <button class="btn pri block" id="pAdd" style="margin-bottom:14px">+ Thêm sản phẩm mới</button>
    ${PRODUCTS.map(p => `
      <div class="oitem">
        <div class="top">
          <div><b>${esc(p.name)}</b> ${p.visible ? '' : '<span class="st-badge st-short">Đang ẩn</span>'} ${p.qty !== null && p.qty <= 0 ? '<span class="st-badge st-short">Hết hàng</span>' : ''} ${p.deliver ? '<span class="st-badge st-done">🎁 Tự giao link</span>' : ''}</div>
          <b>${money(p.price)}</b>
        </div>
        <div class="meta">ID: <code>${esc(p.id)}</code> · ${esc(p.group)} · ${esc(p.duration)} · Số lượng còn: ${p.qty === null ? 'không giới hạn' : p.qty} · Đã bán: ${p.sold || 0}</div>
        <div class="row2"><button class="btn sm" data-edit="${esc(p.id)}" style="flex:1">Sửa</button></div>
      </div>`).join('') || '<div class="card"><div class="empty">Chưa có sản phẩm nào.</div></div>'}`;
  $('#pAdd').onclick = () => showProductForm(null);
  $('#productsTab').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => showProductForm(PRODUCTS.find(p => p.id === b.dataset.edit)));
}
function showProductForm(p) {
  const isNew = !p;
  p = p || { id: '', group: '', name: '', duration: '-', price: 0, warranty: '', need: '', visible: true, comboKey: '', comboCount: 0, optionsText: '', qty: 10 };
  $('#productsTab').innerHTML = `
    <div class="card">
      <h1 style="margin-bottom:14px">${isNew ? 'Thêm sản phẩm mới' : 'Sửa sản phẩm'}</h1>
      <form id="fProduct">
        <label>ID (chữ thường/số/gạch ngang, không đổi được sau khi tạo)</label>
        <input name="id" required pattern="[a-z0-9][a-z0-9-]{1,40}" value="${esc(p.id)}" placeholder="vd: proxy-1t" ${isNew ? '' : 'readonly style="opacity:.6"'}>
        <label>Tên sản phẩm</label><input name="name" required value="${esc(p.name)}">
        <label>Nhóm</label><input name="group" value="${esc(p.group)}" placeholder="vd: Tiện ích">
        <label>Thời hạn</label><input name="duration" value="${esc(p.duration)}" placeholder="vd: 1 tháng, hoặc -">
        <label>Giá (đ) — 0 = Liên hệ, có thể gõ tắt vd 149k hoặc 1.5tr</label><input name="price" required value="${p.price}">
        <label>Số lượng còn (sản phẩm có giá thì để 10, sản phẩm Liên hệ để 1 — bán hết sẽ tự báo Hết hàng)</label>
        <input name="qty" required inputmode="numeric" value="${p.qty === null || p.qty === undefined ? 10 : p.qty}">
        <label>🎁 Nội dung TỰ GIAO ngay khi khách mua xong (vd: link khoá học, link tải, hướng dẫn). Để trống nếu giao từ Kho hoặc giao tay.</label>
        <textarea name="deliver" rows="4" placeholder="vd: Link học: https://... &#10;Mật khẩu vào học: 1234">${esc(p.deliver || '')}</textarea>
        <label>📖 Hướng dẫn sử dụng (tự gửi kèm khi giao hàng: hiện cho khách và gửi vào Gmail của họ). Để trống nếu không cần.</label>
        <textarea name="guide" rows="5" placeholder="vd: Bước 1: Đăng nhập tại ...&#10;Bước 2: ...&#10;Lưu ý: không đổi mật khẩu">${esc(p.guide || '')}</textarea>
        <label>🔥 Đã bán — tự tăng mỗi đơn thật. Nếu trước đây bạn đã bán món này ở nhóm Zalo, nhập đúng số đã bán thật vào đây.</label>
        <input name="sold" inputmode="numeric" value="${p.sold || 0}">
        <label>Bảo hành</label><input name="warranty" value="${esc(p.warranty)}">
        <label>Khách cần gửi thêm (để trống nếu không cần)</label><input name="need" value="${esc(p.need)}" placeholder="vd: Gmail nhận tài khoản">
        <label>Danh sách lựa chọn cho khách bấm (cách nhau dấu phẩy, để trống = khách gõ tay)</label>
        <input name="optionsText" value="${esc(p.optionsText)}" placeholder="vd: Mỹ, Anh, Nhật Bản">
        <label>Mã combo (để trống nếu bán riêng)</label><input name="comboKey" value="${esc(p.comboKey)}">
        <label>Số Gmail cần nhập (chỉ cho sản phẩm combo)</label><input name="comboCount" inputmode="numeric" value="${p.comboCount}">
        <label style="display:flex;align-items:center;gap:8px;margin-top:14px"><input type="checkbox" name="visible" style="width:auto" ${p.visible ? 'checked' : ''}> Hiện trên web cho khách mua</label>
        <div class="err" id="pErr"></div>
        <div class="row2" style="margin-top:14px">
          <button class="btn" type="button" id="pCancel">Huỷ</button>
          <button class="btn pri" type="submit">Lưu</button>
        </div>
        ${isNew ? '' : '<button class="btn bad block" type="button" id="pDelete" style="margin-top:8px">🗑 Xoá sản phẩm này</button>'}
      </form>
    </div>`;
  $('#pCancel').onclick = () => renderProducts();
  $('#fProduct').onsubmit = async e => {
    e.preventDefault();
    const btn = e.target.querySelector('.pri'); btn.disabled = true; $('#pErr').textContent = '';
    const fd = new FormData(e.target);
    try {
      await apiPost({
        action: 'adminSaveProduct', id: fd.get('id'), name: fd.get('name'), group: fd.get('group'),
        duration: fd.get('duration'), price: fd.get('price'), qty: Number(fd.get('qty')), warranty: fd.get('warranty'),
        need: fd.get('need'), deliver: fd.get('deliver'), guide: fd.get('guide'), sold: Number(fd.get('sold')) || 0, optionsText: fd.get('optionsText'), comboKey: fd.get('comboKey'),
        comboCount: Number(fd.get('comboCount')), visible: fd.get('visible') === 'on',
      });
      toast('Đã lưu sản phẩm'); loadProducts();
    } catch (err) { $('#pErr').textContent = err.message; btn.disabled = false; }
  };
  const delBtn = $('#pDelete');
  if (delBtn) delBtn.onclick = async () => {
    if (!confirm('Xoá hẳn sản phẩm "' + p.name + '"? Đơn hàng cũ của sản phẩm này vẫn giữ nguyên, chỉ sản phẩm không còn bán được nữa. Không hoàn tác được.')) return;
    delBtn.disabled = true;
    try { await apiPost({ action: 'adminDeleteProduct', id: p.id }); toast('Đã xoá sản phẩm'); loadProducts(); }
    catch (err) { $('#pErr').textContent = err.message; delBtn.disabled = false; }
  };
}

function enterDash() {
  $('#loginView').style.display = 'none';
  $('#dashView').style.display = 'block';
  renderNav(); renderTabs(); showTab();
}

(function init() {
  const s = getSavedSession();
  if (s) { SESSION = s; enterDash(); }
})();
</script>
